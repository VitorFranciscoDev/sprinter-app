name: sprinter
description: "A social fitness platform for tracking runs, rides, walks, and other outdoor activities, with performance insights and activity sharing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  sentry_flutter: ^9.21.0
  crypto: ^3.0.7
  email_validator: ^3.0.0
  http: ^1.6.0
  go_router: ^17.2.3
  provider: ^6.1.5+1
  intl: any
  flutter_secure_storage: ^10.3.1
  flutter_native_splash: ^2.4.8
  shared_preferences: ^2.5.5
  logger: ^2.7.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/logos/logo.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"

flutter:
  uses-material-design: true
  generate: true

