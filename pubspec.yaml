name: sprinter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  sentry_flutter: ^9.20.0
  crypto: ^3.0.7
  email_validator: ^3.0.0
  http: ^1.6.0
  go_router: ^17.2.3
  provider: ^6.1.5+1
  intl: any
  flutter_secure_storage: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"

flutter:
  uses-material-design: true
  generate: true

